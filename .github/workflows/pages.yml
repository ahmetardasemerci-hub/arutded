name: ArUTDeD Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Pages ayarını yükle
        uses: actions/configure-pages@v5
      - name: Statik dosyaları paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pages’e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
